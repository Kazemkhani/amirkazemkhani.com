<svg
                viewBox="0 0 32 32"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                role="img"
              >
                <title>NOVA logo</title>
                <!-- Four-point star — clean geometric nova burst -->
                <path
                  d="M16 2L18.8 12.2L28 9L20.2 15.2L30 16L20.2 16.8L28 23L18.8 19.8L16 30L13.2 19.8L4 23L11.8 16.8L2 16L11.8 15.2L4 9L13.2 12.2L16 2Z"
                  fill="url(#nova-burst)"
                />
                <!-- Bright core -->
                <circle cx="16" cy="16" r="3.5" fill="url(#nova-core)" />
                <circle cx="16" cy="16" r="2" fill="white" opacity="0.95" />
                <defs>
                  <linearGradient id="nova-burst" x1="2" y1="2" x2="30" y2="30">
                    <stop offset="0%" stop-color="#f4d99a" />
                    <stop offset="50%" stop-color="#e8c987" />
                    <stop offset="100%" stop-color="#c9a96a" />
                  </linearGradient>
                  <radialGradient
                    id="nova-core"
                    cx="16"
                    cy="16"
                    r="3.5"
                    gradientUnits="userSpaceOnUse"
                  >
                    <stop offset="0%" stop-color="#fdf6e3" />
                    <stop offset="100%" stop-color="#e8c987" />
                  </radialGradient>
                </defs>
              </svg>